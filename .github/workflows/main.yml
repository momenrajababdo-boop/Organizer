<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b2d">
<title>Organizer | تجربة تفاعلية</title>
<style>
:root {
  --bg: #f3f6fb;
  --card: #fff;
  --ink: #172338;
  --muted: #718096;
  --blue: #315ee8;
  --line: #e7ecf4;
  --green: #16865b;
  --red: #d34d5b;
  --custom-radius: 16px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  overscroll-behavior-x: contain;
}
header {
  background: linear-gradient(135deg, #101b2d, #243d67);
  color: #fff;
  padding: 22px 18px 28px;
  border-radius: 0 0 26px 26px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .brand {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 1px;
}
.top-time {
  display: flex;
  gap: 8px;
  align-items: center;
}
.clock {
  font-size: 19px;
  font-weight: 700;
  background: #ffffff18;
  border: 1px solid #ffffff30;
  border-radius: 14px;
  padding: 8px 12px;
  font-variant-numeric: tabular-nums;
}
.weekday-box {
  background: #ffffff18;
  border: 1px solid #ffffff30;
  border-radius: 14px;
  padding: 8px 12px;
  font-weight: 700;
}
#greet {
  font-size: 23px;
  font-weight: 800;
  margin: 20px 0 5px;
}
#quote {
  color: #dbe6ff;
  font-size: 14px;
}
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  white-space: nowrap;
  padding: 13px 14px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
  scrollbar-width: none;
}
nav::-webkit-scrollbar {
  display: none;
}
nav button {
  white-space: nowrap;
  border: 1px solid var(--line);
  background: #fff;
  color: #526078;
  border-radius: 13px;
  padding: 10px 13px;
  font-weight: 700;
}
nav button.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
main {
  max-width: 850px;
  margin: auto;
  padding: 6px 14px 90px;
  touch-action: pan-y;
}
.page {
  display: none;
}
.page.active {
  display: block;
  animation: fade .22s ease;
}
@keyframes fade {
  from { opacity: .65; transform: translateX(8px); }
  to { opacity: 1; transform: translateX(0); }
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--custom-radius);
  padding: 16px;
  margin: 10px 0;
  box-shadow: 0 5px 18px #1d35570a;
}
#finance .card {
  margin: 18px 0;
  padding: 18px;
}
#finance .grid {
  gap: 14px;
}
#finance .metric {
  padding: 16px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.metric {
  padding: 14px;
  border-radius: 15px;
  background: #f7f9fd;
}
.metric small {
  color: var(--muted);
}
.metric strong {
  display: block;
  font-size: 22px;
  margin-top: 5px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.muted, small {
  color: var(--muted);
}
h2 {
  font-size: 20px;
  margin: 12px 2px;
}
h3 {
  font-size: 16px;
  margin: 3px 0 12px;
}
button, .btn {
  cursor: pointer;
  font: inherit;
}
.primary {
  background: var(--blue);
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: 700;
}
.secondary {
  background: #eef2ff;
  color: #294dcc;
  border: 0;
  border-radius: 12px;
  padding: 9px 12px;
  font-weight: 700;
}
.danger {
  background: #fff0f1;
  color: #b52e40;
  border: 0;
  border-radius: 10px;
  padding: 7px 10px;
}
.field {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.field input, .field select, .field textarea, input, select, textarea {
  font: inherit;
  border: 1px solid #dce3ef;
  border-radius: 11px;
  padding: 10px;
  background: #fff;
  color: var(--ink);
  min-width: 0;
}
.field input {
  flex: 1;
}
.item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.item:last-child {
  border: 0;
}
.pill {
  font-size: 12px;
  border-radius: 30px;
  padding: 5px 9px;
  background: #edf2ff;
  color: #3457c5;
}
.prayer {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}
.prayer button {
  border: 1px solid var(--line);
  background: #f7f9fd;
  border-radius: 13px;
  padding: 13px 3px;
  color: var(--ink);
  font-weight: 700;
}
.prayer button.done {
  background: #d9f5e9;
  border: 1px solid #74c9a5;
  color: #116c48;
}
.hint {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}
.chart {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  height: 115px;
  padding: 12px 5px 20px;
}
.chart div {
  flex: 1;
  background: #9bb2ff;
  border-radius: 7px 7px 2px 2px;
  position: relative;
  min-height: 6px;
}
.chart label {
  position: absolute;
  top: calc(100% + 5px);
  font-size: 10px;
  white-space: nowrap;
  left: 50%;
  transform: translateX(-50%);
  color: var(--muted);
}
.more-wrap {
  position: relative;
  display: inline-block;
  flex-shrink: 0;
}
.more-btn {
  border: 0;
  background: #f0f3f9;
  color: #33415c;
  border-radius: 10px;
  width: 34px;
  height: 34px;
  font-size: 22px;
  line-height: 1;
}
.more-menu {
  display: none;
  position: absolute;
  left: 0;
  top: 38px;
  z-index: 20;
  min-width: 112px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 8px 24px #17233820;
  padding: 5px;
}
.more-menu.open {
  display: block;
}
.more-menu button {
  display: block;
  width: 100%;
  text-align: right;
  border: 0;
  background: #fff;
  padding: 9px;
  border-radius: 8px;
  color: var(--ink);
}
.more-menu button:hover {
  background: #f3f6fb;
}
.task-tile {
  display: block;
  width: 100%;
  text-align: center;
  padding: 11px 10px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #f7f9fd;
  color: var(--ink);
  font-weight: 700;
  font-size: 14px;
  margin: 4px 0;
  transition: all .25s ease;
}
.task-tile small {
  display: block;
  font-size: 12px;
  color: inherit;
}
.item.task-done .task-tile,
.task-tile.done {
  background: #d9f5e9;
  border: 1px solid #74c9a5;
  color: #116c48;
  transform: scale(.985);
}
.achievement-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.achievement {
  position: relative;
  overflow: hidden;
  min-height: 84px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  color: var(--ink);
  padding: 9px 4px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: .35s;
  font: inherit;
}
.achievement small,
.achievement strong {
  position: relative;
  z-index: 3;
}
.achievement strong {
  font-size: 18px;
}
.achievement .fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: linear-gradient(180deg, #d7e4ff, #8fb4ff);
  opacity: .75;
  transition: height .7s cubic-bezier(.2, .7, .2, 1);
  z-index: 1;
}
.achievement.complete {
  border: 2px solid #16865b;
  color: #14754b;
  cursor: pointer;
}
.achievement.complete .fill {
  background: #c8f0d6;
}
.history-box {
  display: none;
  padding: 8px;
  margin-top: 8px;
}
.history-box.open {
  display: block;
}
.work-item {
  border-bottom: 1px solid var(--line);
  padding: 8px;
}
#workExpenseTotal {
  font-weight: 800;
  font-size: 18px;
  color: var(--blue);
}
.settings-btn {
  margin-right: 8px;
}
.settings-panel {
  display: none;
  position: fixed;
  inset: 0;
  background: #14203388;
  z-index: 1000;
  padding: 16px;
  overflow: auto;
}
.settings-panel.open {
  display: block;
}
.settings-panel .card {
  max-width: 650px;
  margin: 6vh auto;
}
.settings-control-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.settings-control-grid label {
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 12px;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.section-hidden {
  display: none !important;
}

/* Splash Screen */
#splash {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #111;
  color: #f8f8f8;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  transition: opacity .65s ease, visibility .65s ease;
}
#splash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.orbit {
  width: 180px;
  height: 180px;
  border: 2px solid transparent;
  border-top-color: #caa34a;
  border-bottom-color: #8db9ff;
  border-radius: 50%;
  position: absolute;
  animation: orbitspin 2.4s linear infinite;
}
.orbit i {
  position: absolute;
  inset: 15px;
  border: 2px solid transparent;
  border-right-color: var(--blue);
  border-left-color: #9dc2ff;
  border-radius: 50%;
  animation: orbitspin 1
