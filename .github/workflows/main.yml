
name: Build Organizer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'Organizer_Android_Project*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android ZIP not found"
            exit 1
          fi
          mkdir project
          unzip -o "$ZIP_FILE" -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          GRADLE=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLE" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          chmod +x "$GRADLE"
          cd "$(dirname "$GRADLE")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
